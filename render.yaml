# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys two services:
#   1. nox-pos      — the POS itself, a static PWA (works fully offline)
#   2. nox-pos-api  — the Oracle sync backend (optional; see note below)
#
# NOTE ON THE BACKEND: it needs a database it can actually reach. A local
# Oracle XE on your PC is NOT reachable from Render. Point it at Oracle Cloud
# (Autonomous DB) or an Oracle exposed on a public host, then fill the env
# vars in the Render dashboard. Until then, deploy only the static site — the
# POS runs without it and just keeps sales queued locally.

services:
  # ---------------------------------------------------------------- frontend
  - type: web
    runtime: static
    name: nox-pos
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      # Set this to the API URL once the backend is live, e.g.
      # https://nox-pos-api.onrender.com/pos/sales  — then trigger a redeploy.
      - key: VITE_SYNC_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache

  # ----------------------------------------------------------------- backend
  - type: web
    runtime: node
    name: nox-pos-api
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ORACLE_USER
        sync: false
      - key: ORACLE_PASSWORD
        sync: false
      - key: ORACLE_CONNECT_STRING
        sync: false
      - key: CORS_ORIGINS
        # the deployed POS origin; update if you use a custom domain
        value: https://nox-pos.onrender.com
