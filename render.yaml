# Render Blueprint — https://render.com/docs/blueprint-spec
#
#   1. nox-pos      — the POS, a static PWA (works fully offline, no config)
#   2. nox-pos-api  — the Oracle sync backend (optional)
#
# The backend needs a database it can actually reach. A local Oracle XE on
# your PC is NOT reachable from Render — point it at Oracle Cloud (Autonomous
# DB) or a publicly reachable Oracle and fill the env vars in the dashboard.
# Don't need cloud sync yet? Deploy only nox-pos; the POS is unaffected.

services:
  # ---------------------------------------------------------------- frontend
  - type: web
    runtime: static
    name: nox-pos
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Point at the API once it's live, e.g.
      # https://nox-pos-api.onrender.com/pos/sales  — then redeploy.
      - key: VITE_SYNC_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ----------------------------------------------------------------- backend
  - type: web
    runtime: node
    name: nox-pos-api
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ORACLE_USER
        sync: false
      - key: ORACLE_PASSWORD
        sync: false
      - key: ORACLE_CONNECT_STRING
        sync: false
      - key: CORS_ORIGINS
        value: https://nox-pos.onrender.com
